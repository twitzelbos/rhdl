[package]
name = "rhdl-bsp"
version = "0.1.0"
edition = "2021"

[build-dependencies]
# Only the build script reads the primitive libraries, so `ron` never
# enters the runtime dependency graph -- see build.rs for why the file is
# read at compile time rather than when a descriptor is built.
ron = "0.10.1"
serde = { version = "1", features = ["derive"] }

[dependencies]
rhdl-fpga = { path = "../rhdl-fpga" }
camino = "1.1.9"
expect-test = "1.5.1"
rhdl = { path = "../rhdl" }
thiserror = "2.0.12"
quote = "1.0.40"
syn = "2.0.106"
proc-macro2 = "1.0.101"
miette = "7.6.0"

[dev-dependencies]
rhdl-toolchains = { path = "../rhdl-toolchains" }
